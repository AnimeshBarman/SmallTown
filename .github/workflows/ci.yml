name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smalltown
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smalltown"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URI: postgresql+psycopg2://postgres:postgres@localhost:5432/smalltown
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-only-not-a-real-key
      GROQ_API_KEY: ci-only-not-a-real-key
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: alembic upgrade head
      - name: Verify the adoption migration is safe to reapply
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from config import settings

          engine = create_engine(settings.DATABASE_URI)
          with engine.begin() as connection:
              connection.execute(text("DELETE FROM alembic_version"))
          PY
          alembic upgrade head

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
